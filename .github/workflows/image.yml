# Builds the server image on every change to it and publishes it to GitHub's
# container registry. The Railway template deploys this image.
name: image

on:
  push:
    branches: [main]
    paths: [src/**, public/**, Dockerfile, docker-entrypoint.sh, package.json, package-lock.json, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/manas-katyal/lademcp:latest
            ghcr.io/manas-katyal/lademcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/manas-katyal/lademcp
            org.opencontainers.image.description=LadeMCP: smart charging for Danish home chargers on day-ahead prices and CO2
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
